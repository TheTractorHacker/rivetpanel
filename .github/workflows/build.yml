name: Build apps and installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb python3-tk
          pip install -r Linux/requirements.txt pyyaml pip-audit
      - name: Known-vulnerability audit of the shipped dependencies
        run: |
          # Windows pins exact versions: audit the file as written (winotify is Windows-only, excluded from resolution).
          grep -v -i '^winotify' Windows/requirements.txt > /tmp/req-windows.txt
          pip-audit --no-deps --disable-pip -r /tmp/req-windows.txt
          # Linux/macOS use floors: audit what actually resolved in this environment (same cross-platform set).
          pip-audit --skip-editable
      - name: Tests
        env:
          RIVETPANEL_STRICT_DEPS: '1'
        run: |
          python tests/test_provider.py
          python tests/test_panel_provider.py
          python tests/test_workflow_security.py
          python tests/test_container_security.py
          python tests/test_dependencies.py
          xvfb-run -a python tests/test_security.py
          xvfb-run -a python tests/test_path_security.py
          xvfb-run -a python tests/test_auth_credentials.py

  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned explicitly (rather than relying on windows-latest's default)
      # since the installer now refuses to run on non-x64 Windows
      # (ArchitecturesAllowed=x64 in RivetPanel.iss) - a 32-bit build here
      # would produce an exe the installer itself would reject.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install Python dependencies
        working-directory: Windows
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select PSA provider (rivet)
        run: python scripts/select_provider.py rivet

      - name: Build tray app exe with PyInstaller
        working-directory: Windows
        run: pyinstaller rivetpanel.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\RivetPanel.iss'

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rivetpanel-windows
          path: |
            Windows/dist/RivetPanel.exe
            installer/Output/RivetPanelSetup.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            Windows/dist/RivetPanel.exe
            installer/Output/RivetPanelSetup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-gi gir1.2-appindicator3-0.1 scrot

      - name: Install Python dependencies
        working-directory: Linux
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select PSA provider (rivet)
        run: python scripts/select_provider.py rivet

      - name: Build binary with PyInstaller
        working-directory: Linux
        run: pyinstaller rivetpanel.spec

      - name: Package release bundle
        working-directory: Linux
        run: |
          mkdir -p package
          cp dist/RivetPanel package/
          cp install.sh rivetpanel.desktop package/
          cp -r assets package/
          tar -czf rivetpanel-linux.tar.gz -C package .

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rivetpanel-linux
          path: Linux/rivetpanel-linux.tar.gz

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: Linux/rivetpanel-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: macOS
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select PSA provider (rivet)
        run: python scripts/select_provider.py rivet

      - name: Build app with PyInstaller
        working-directory: macOS
        run: pyinstaller rivetpanel.spec

      - name: Package release bundle
        working-directory: macOS
        run: |
          mkdir -p package
          cp -R dist/RivetPanel.app package/
          cp install.sh com.foleyit.rivetpanel.plist package/
          cd package && zip -r ../rivetpanel-macos.zip .

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rivetpanel-macos
          path: macOS/rivetpanel-macos.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: macOS/rivetpanel-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Signs the three platform artifacts so common/core.py's self-update mechanism
  # can verify authenticity before ever extracting/executing a downloaded update.
  # Runs after all three builds so it can hash the SAME bytes that got uploaded
  # as release assets, not a locally-rebuilt copy. RELEASE_SIGNING_PRIVATE_KEY is
  # an Ed25519 private key (base64, raw 32 bytes) - see scripts/sign_release.py
  # for the format. This secret must be set in the repo's Settings > Secrets
  # before tagging a release, or do_self_update() will refuse to install it
  # (fail closed - missing checksums.txt/.sig aborts the update).
  sign-release:
    permissions:
      contents: write
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install signing dependency
        run: pip install "cryptography>=50.0.2"

      - name: Download all platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      - name: Sign release assets
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          mkdir -p signed
          python3 scripts/sign_release.py "$RELEASE_SIGNING_PRIVATE_KEY" signed \
            dist/rivetpanel-windows/RivetPanel.exe \
            dist/rivetpanel-windows/RivetPanelSetup.exe \
            dist/rivetpanel-linux/rivetpanel-linux.tar.gz \
            dist/rivetpanel-macos/rivetpanel-macos.zip

      - name: Upload checksums + signature to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            signed/checksums.txt
            signed/checksums.txt.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
